[workspace]
members = [".", "xtask"]
resolver = "3"

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.97.1"
authors = ["dinglebear.ai <hello@dinglebear.ai>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dinglebear-ai/synapse#readme"
repository = "https://github.com/dinglebear-ai/synapse"

[workspace.dependencies]
rmcp = { version = "=3.0.0-beta.2", default-features = false }
schemars = "=1.2.1"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "warn"
unescaped_backticks = "warn"
redundant_explicit_links = "warn"

[workspace.lints.rust]
missing_docs = "allow"
missing_crate_level_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"

[package]
name = "synapse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["command-line-utilities", "virtualization", "filesystem", "network-programming", "development-tools"]
keywords = ["mcp", "docker", "ssh", "zfs", "homelab"]
description = "MCP server and CLI for host and container operations: Docker and Compose control, SSH, host inspection, logs, ZFS, and safe file transfer."
publish = false
autobins = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP / MCP transport
axum = "0.8"
rmcp = { workspace = true, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
  "transport-io",
  "elicitation",
  "schemars",
] }
tower-http = { version = "0.7", features = ["cors", "limit", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars.workspace = true

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "1.1"

# OAuth + JWT
lab-auth = { git = "https://github.com/dinglebear-ai/labby.git", rev = "87cec3241f9baef22335de9cc8629ebbcd8ba047", package = "lab-auth" }
url = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client. (Kept at 0.12: reqwest 0.13 renamed the rustls-tls feature flags;
# deduping with lab-auth's 0.13 is deferred to a focused follow-up.)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Platform dirs — for default_data_dir() (~/.synapse detection)
# TEMPLATE: Used in config.rs default_data_dir(). Keep this dep.
dirs = "6"

# SSH config parser for ~/.ssh/config auto-discovery
ssh2-config = "0.7"
# Track every file matched by SSH Include directives for cache invalidation.
glob = "0.3"

# Errors
anyhow = "1"
thiserror = "2"

# Tower middleware (direct dep for the custom concurrency-limit Layer in server/routes.rs;
# already present transitively via axum).
tower = "0.5"

# SSH transport (scout remote exec + flux forwarded docker socket).
# process-mux delegates command execution to OpenSSH's mux client, matching the
# mux sockets created by local ssh configs on the managed fleet.
openssh = "0.11"

# Object-safe async trait (SshExecutor → Box<dyn SshExecutor>; Confirmer gate).
async-trait = "0.1"

# Concurrent hash map (cache + per-host SSH session pool).
dashmap = "6"

# Docker Engine API client (flux docker/container/compose ops). Cached per host;
# remote hosts connect through B1's SSH-forwarded unix socket. bollard's `Docker`
# is cheap to Clone (Arc-internal), so each cache entry holds it by value.
bollard = "0.21"

# Stream combinators for bollard logs()/stats() streaming surfaces.
futures-util = "0.3"

# Static asset embedding (web UI)
include_dir = { version = "0.7", optional = true }

# Descriptor-relative filesystem access for Scout read-root confinement.
rustix = { version = "1", features = ["fs"] }

[features]
default = ["web"]
web = ["include_dir"]
test-support = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
synapse = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
# Bytes is bollard's payload type for LogOutput frames; needed to construct
# canned log frames in B8 container_read unit tests.
bytes = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rmcp = { workspace = true, features = [
  "client",
  "transport-child-process",
] }
