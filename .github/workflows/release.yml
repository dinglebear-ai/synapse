name: Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  artifact:
    name: Build hosted x86_64 artifact
    uses: dinglebear-ai/workflows/.github/workflows/hosted-rust-platform-release.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      toolchain: "1.97.1"
      targets-json: >-
        [{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]
      build-command: |
        cd apps/web
        corepack enable
        pnpm install --frozen-lockfile
        pnpm build
        cd ../..
        cargo build --release --locked --target "$TARGET" --bin synapse
      package-command: |
        set -euo pipefail
        mkdir -p dist
        cp "target/$TARGET/release/synapse" dist/synapse-linux-x86_64
        (cd dist && sha256sum synapse-linux-x86_64 > synapse-linux-x86_64.sha256)
        tar -C "target/$TARGET/release" -czf dist/synapse-x86_64.tar.gz synapse
        (cd dist && sha256sum synapse-x86_64.tar.gz > synapse-x86_64.tar.gz.sha256)
      artifact-path: dist/*
      artifact-prefix: synapse

  github-release:
    name: Attach verified artifacts
    needs: [artifact]
    uses: dinglebear-ai/workflows/.github/workflows/github-release.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      release-tag: ${{ github.event.release.tag_name }}
      artifact-pattern: synapse-*

  npm:
    name: Publish npm launcher
    needs: [metadata, github-release]
    uses: dinglebear-ai/workflows/.github/workflows/npm-trusted-publish.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      expected-version: ${{ needs.metadata.outputs.version }}
      working-directory: packages/synapse-rmcp
      enable-cache: false
      install-command: ""
      verify-command: |
        node -e "process.exit(Object.hasOwn(require('./package.json'), 'binaryVersion') ? 1 : 0)"
        npm test
        npm run check
        npm pack --dry-run --json
