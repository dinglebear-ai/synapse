# =============================================================================
# .github/workflows/ci.yml — Continuous Integration
#
# TEMPLATE substitutions required:
#   REPO_NAME   → your GitHub repo name (e.g. "myservice-mcp")
#   BINARY_NAME → your binary name from Cargo.toml [[bin]] (e.g. "myservice")
#
# This workflow runs on every push and PR to main.
# Jobs: fmt, clippy, test (nextest), web, toml, template checks, deny
#
# All jobs must pass before merging. Adjust the matrix rust-version to match
# your Cargo.toml `rust-version` field.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # ── fmt: cargo fmt --check ──────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: [self-hosted, ci-pool-rust]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── clippy: zero warnings ────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: [self-hosted, ci-pool-rust]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1
          components: clippy

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  # ── test: cargo nextest run --profile ci ─────────────────────────────────────
  test:
    name: Test
    runs-on: [self-hosted, ci-pool-rust]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@95cc2373c3f00275e315c306e56fef1c7a8854c0 # cargo-nextest

      - name: cargo nextest run --profile ci
        run: cargo nextest run --profile ci

  coverage:
    name: Coverage (65% lines)
    runs-on: [self-hosted, ci-pool-rust]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@95cc2373c3f00275e315c306e56fef1c7a8854c0 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - name: Enforce line coverage floor
        run: |
          mkdir -p target/llvm-cov/profiles
          LLVM_PROFILE_FILE="target/llvm-cov/profiles/%p-%m.profraw" \
            cargo llvm-cov --locked --workspace --all-features --fail-under-lines 65

  live-integration:
    name: Live JSON-RPC + SSH
    runs-on: [self-hosted, ci-pool-system]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1

      - name: Configure disposable localhost SSH fixture
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo ssh-keygen -A
          rm -f "$RUNNER_TEMP/id_ed25519" "$RUNNER_TEMP/id_ed25519.pub"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/id_ed25519"
          # Self-hosted runners persist between jobs. Reuse the fixture account
          # when present, but keep password login disabled in every run.
          if id -u synapse-ci >/dev/null 2>&1; then
            sudo usermod --home /home/synapse-ci --shell /bin/bash --password '*' synapse-ci
          else
            sudo useradd --create-home --shell /bin/bash --password '*' synapse-ci
          fi
          sudo install -d -m 700 -o synapse-ci -g synapse-ci /home/synapse-ci/.ssh
          sudo install -m 600 -o synapse-ci -g synapse-ci \
            "$RUNNER_TEMP/id_ed25519.pub" /home/synapse-ci/.ssh/authorized_keys
          chmod 600 "$RUNNER_TEMP/id_ed25519"
          ssh_port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          echo "SYNAPSE_TEST_SSH_PORT=$ssh_port" >>"$GITHUB_ENV"
          cat >"$RUNNER_TEMP/sshd_config" <<EOF
          Port $ssh_port
          ListenAddress 127.0.0.1
          PidFile $RUNNER_TEMP/sshd.pid
          HostKey /etc/ssh/ssh_host_ed25519_key
          AuthorizedKeysFile .ssh/authorized_keys
          PasswordAuthentication no
          PubkeyAuthentication yes
          StrictModes yes
          UsePAM no
          AllowUsers synapse-ci
          EOF
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config" -E "$RUNNER_TEMP/sshd.log"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$ssh_port" 127.0.0.1 >>"$HOME/.ssh/known_hosts" 2>/dev/null
          if ! ssh -o BatchMode=yes -i "$RUNNER_TEMP/id_ed25519" -p "$ssh_port" \
            synapse-ci@127.0.0.1 true; then
            sudo cat "$RUNNER_TEMP/sshd.log"
            exit 1
          fi
          printf '%s\n' 'synapse-live-ssh-ok' >/tmp/synapse-ci-fixture

      - name: Exercise SSH pool against the fixture
        env:
          SYNAPSE_TEST_SSH_REQUIRED: "1"
          SYNAPSE_TEST_SSH_HOST: 127.0.0.1
          SYNAPSE_TEST_SSH_USER: synapse-ci
          SYNAPSE_TEST_SSH_KEY: ${{ runner.temp }}/id_ed25519
        run: cargo test --locked --test ssh_pool

      - name: Exercise live MCP JSON-RPC through SSH
        shell: bash
        env:
          SYNAPSE_HOME: ${{ runner.temp }}/synapse-home
          SYNAPSE_MCP_HOST: 127.0.0.1
          SYNAPSE_MCP_PORT: "40080"
          SYNAPSE_MCP_NO_AUTH: "true"
        run: |
          mkdir -p "$SYNAPSE_HOME"
          synapse_hosts_config="$(python3 -c 'import json, os; print(json.dumps([{"name": "ci-ssh", "host": "127.0.0.1", "protocol": "ssh", "sshUser": "synapse-ci", "sshKeyPath": os.path.join(os.environ["RUNNER_TEMP"], "id_ed25519"), "sshPort": int(os.environ["SYNAPSE_TEST_SSH_PORT"]), "scoutReadRoots": ["/tmp"]}]))')"
          export SYNAPSE_HOSTS_CONFIG="$synapse_hosts_config"
          cargo build --locked
          target/debug/synapse serve mcp >"$RUNNER_TEMP/synapse.log" 2>&1 &
          server_pid=$!
          trap 'rc=$?; if (( rc != 0 )); then cat "$RUNNER_TEMP/synapse.log"; fi; kill "$server_pid" 2>/dev/null || true; exit $rc' EXIT
          bash scripts/test-live-jsonrpc.sh

      - name: Stop disposable SSH fixture
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/sshd.pid" ]]; then
            sudo kill "$(cat "$RUNNER_TEMP/sshd.pid")" 2>/dev/null || true
          fi

  # ── web: pnpm install, lint, audit, static build ─────────────────────────────
  web:
    name: Web
    runs-on: [self-hosted, ci-pool-typescript]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --prod --audit-level high

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm typecheck
        run: pnpm typecheck

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

  # ── toml: taplo check ─────────────────────────────────────────────────────────
  toml:
    name: TOML Format
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Fails when Cargo.toml, package.json, server.json and friends disagree
      # on the version. Previously reachable only by hand, which is how a
      # sibling repo sat seven releases out of sync unnoticed.
      - name: Check version sync
        run: bash scripts/check-version-sync.sh

      - name: Install taplo
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: taplo

      - name: taplo check
        run: taplo check

  # ── template: generated docs, plugin layout, coupled files ───────────────────
  template:
    name: Template Contracts
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1

      - name: Check PATTERNS.md contracts
        run: cargo xtask patterns

      - name: Check test sibling coverage
        run: cargo xtask check-test-siblings

      - name: Check Rust module sizes (NO MONOLITHS)
        run: bash scripts/check-rust-module-size.sh

      - name: Validate plugin layout
        run: bash scripts/validate-plugin-layout.sh

      - name: Check schema docs
        run: python3 scripts/check-schema-docs.py --check

      - name: Check OpenAPI docs
        run: python3 scripts/check-openapi.py --check

      - name: Check identity and operation registry contract
        run: python3 scripts/check-identity-contract.py

      - name: Check scaffold intent contract
        run: python3 scripts/check-scaffold-intent-contract.py

      - name: Run template feature smoke tests
        run: bash scripts/test-template-features.sh

      - name: Check blob sizes
        run: python3 scripts/check-blob-size.py --base origin/main --head HEAD

      - name: Check coupled files
        run: bash scripts/check-coupled-files.sh origin/main HEAD

      - name: ASCII hygiene
        run: bash scripts/run-ascii-check.sh

  # ── deny: dependency advisories, licenses, bans, sources ─────────────────────
  audit:
    name: Cargo Deny
    runs-on: [self-hosted, ci-pool-rust]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: 1.97.1

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check
          arguments: --all-features

      - name: Install cargo-deny for exception guard
        uses: taiki-e/install-action@95cc2373c3f00275e315c306e56fef1c7a8854c0
        with:
          tool: cargo-deny

      - name: Enforce time-bounded yanked exceptions
        run: python3 scripts/check-yanked-exceptions.py

  npm:
    name: npm launcher
    runs-on: [self-hosted, ci-pool-typescript]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Test npm launcher
        run: npm test --prefix packages/synapse-rmcp
      - name: Check npm launcher syntax
        run: npm run check --prefix packages/synapse-rmcp
      - name: Dry-run npm package
        run: npm pack --dry-run --json ./packages/synapse-rmcp

  container:
    name: Container smoke
    runs-on: [self-hosted, ci-pool-system]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve production Compose
        env:
          DOCKER_GID: "999"
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build deployable image
        run: docker build -f config/Dockerfile -t synapse2:ci .
      - name: Smoke liveness
        run: |
          docker run -d --rm --name synapse2-ci -p 127.0.0.1:40080:40080 \
            -e SYNAPSE_MCP_HOST=0.0.0.0 \
            -e SYNAPSE_MCP_TOKEN=ci-smoke-token-with-sufficient-length synapse2:ci
          trap 'docker logs synapse2-ci; docker stop synapse2-ci >/dev/null' EXIT
          for _attempt in {1..30}; do
            curl -fsS http://127.0.0.1:40080/health && exit 0
            sleep 1
          done
          exit 1
      - name: Smoke container runtime dependencies
        run: |
          docker run --rm synapse2:ci docker compose version
          docker run --rm synapse2:ci python3 --version

      - name: Smoke real local Scout execution
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/synapse-scout"
          mkdir -p "$fixture"
          printf '%s\n' 'container-scout-ok' >"$fixture/input.txt"
          output="$(docker run --rm \
            -v "$fixture:/tmp/synapse-scout:ro" \
            synapse2:ci scout exec \
              --host local \
              --command cat \
              --args /tmp/synapse-scout/input.txt \
              --response-format json)"
          grep -F 'container-scout-ok' <<<"$output"

      - name: Smoke real local Compose discovery
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/synapse-compose/smoke"
          mkdir -p "$fixture"
          cat >"$fixture/compose.yml" <<'EOF'
          name: synapse-ci-smoke
          services:
            noop:
              image: busybox:1.36
          EOF
          output="$(docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/synapse-compose:/compose:ro" \
            synapse2:ci flux compose list \
              --host local \
              --response-format json)"
          grep -F 'synapse-ci-smoke' <<<"$output"
